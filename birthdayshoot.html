<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Birthday Girl Shoots — Sandun Dilhara</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg:#0a0e1a;
      --card:#1a1f35;
      --accent:#ffffff;
      --text:#ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Montserrat, Segoe UI, system-ui, Arial, sans-serif;
      background: linear-gradient(-45deg, #0a0e1a, #1a1f35, #040406, #0a0e1a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text);
    }

    @keyframes gradientBG {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      padding: 22px 40px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .btn-back {
      border: 2px solid var(--accent);
      padding: 10px 16px;
      border-radius: 10px;
      transition: 0.3s ease;
    }

    .btn-back:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .lead {
      color: #b8c2d6;
      margin-bottom: 28px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .video-grid figure {
      background: var(--card);
      padding: 12px;
      border-radius: 14px;
      transition: 0.3s ease;
    }

    .video-grid figure:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }

    .video-grid img {
      width: 100%;
      height: auto;              /* keep natural height */
      max-height: 500px;         /* limit height if needed */
      object-fit: cover;         /* fill container without black bars */
      border-radius: 10px;
      display: block;
      background: transparent;   /* remove black background */
    }

    .meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      font-size: 14px;
    }

    footer {
      margin: 70px 0 40px;
      text-align: center;
      font-size: 14px;
      color: #9aa6c4;
    }

    /* Lightbox styles */
    .lightbox img { cursor: zoom-in; display:block; border-radius:10px; }
    .lb-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
    }
    .lb-overlay.open { display: flex; }
    .lb-overlay img {
      max-width: 96%;
      max-height: 96%;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    .lb-close {
      position: absolute;
      top: 18px;
      right: 18px;
      color: #fff;
      font-size: 28px;
      line-height: 1;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      header {
        padding: 18px 20px;
      }

      h1 {
        font-size: 28px;
      }

      .video-grid img {
        height: 200px;
      }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html#services">&larr; Back to Services</a>
    <a class="btn-back" href="index.html#home">Home</a>
</header>

<main class="container">
  <h1>Birthday Girl Shoots</h1>
  <p class="lead">
    Celebrate elegance and joy with cinematic birthday shoots. Click any photo to explore the magic.
  </p>

  <div class="video-grid">

    <figure>
      <a href="https://github.com/sandun113/Photography-New-Web/blob/main/1.JPG?raw=true" class="lightbox">
        <img src="https://github.com/sandun113/Photography-New-Web/blob/main/1.JPG?raw=true" alt="Birthday girl standing and smiling in a sunlit garden surrounded by flowering shrubs; joyful and serene">
      </a>
      <figcaption class="meta">
        <strong>1</strong> <span>• Garden Portraits</span>
      </figcaption>
    </figure>

    <figure>
      <a href="https://github.com/sandun113/Photography-New-Web/blob/main/2.JPG?raw=true" class="lightbox">
        <img src="https://github.com/sandun113/Photography-New-Web/blob/main/2.JPG?raw=true" alt="Birthday girl sitting on a blanket at sunset holding a small cake with a lit candle; warm and celebratory">
      </a>
      <figcaption class="meta">
        <strong>2</strong> <span>• Sunset Celebration</span>

    <figure>
      <a href="https://github.com/sandun113/Photography-New-Web/blob/main/3.JPG?raw=true" class="lightbox">
        <img src="https://github.com/sandun113/Photography-New-Web/blob/main/3.JPG?raw=true" alt="Birthday girl in an elegant indoor setup with soft lighting and decorative elements; sophisticated and joyful">
      </a>
      <figcaption class="meta">

    <figure>
      <a href="https://github.com/sandun113/Photography-New-Web/blob/main/4.JPG?raw=true" class="lightbox">
        <img src="https://github.com/sandun113/Photography-New-Web/blob/main/4.JPG?raw=true" alt="Birthday girl at a beach party with a festive atmosphere, holding a drink and laughing; carefree and happy">
      </a>

    <figure>

        <img src="https://github.com/sandun113/Photography-New-Web/blob/main/6.JPG?raw=true" alt="Birthday girl in an elegant indoor setup with a grand piano and soft, warm lighting; classy and joyful">
      </a>
      <figcaption class="meta">
        <strong>6</strong> <span>• Elegant Indoor Setup</span>
      </figcaption>
    </figure>

  </div>

  <!-- Lightbox overlay (reusable) -->
  <div class="lb-overlay" id="lbOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="Close">×</button>
    <img id="lbImage" src="" alt="">
  </div>

</main>

<footer>
  &copy; 2025 Sandun Dilhara — Birthday Shoots
</footer>

<script>
  // Simple accessible lightbox (client-side only)
  (function(){
    const links = document.querySelectorAll('a.lightbox');
    const overlay = document.getElementById('lbOverlay');
    const lbImage = document.getElementById('lbImage');
    const closeBtn = document.getElementById('lbClose');

    function open(src, alt){
      lbImage.src = src;
      lbImage.alt = alt || '';
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden','false');
      closeBtn.focus();
      document.body.style.overflow = 'hidden';
    }
    function close(){
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden','true');
      lbImage.src = '';
      document.body.style.overflow = '';
    }

    links.forEach(a => {
      a.addEventListener('click', function(e){
        e.preventDefault();
        const img = a.querySelector('img');
        const src = a.getAttribute('href') || img.src;
        open(src, img.getAttribute('alt'));
      });
    });

    overlay.addEventListener('click', function(e){
      if(e.target === overlay || e.target === closeBtn) close();
    });

    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && overlay.classList.contains('open')) close();
    });
  })();
</script>

</body>
</html>
